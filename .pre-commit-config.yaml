# commit-msg is listed so a plain `pre-commit install` wires the message
# check too; without it only the pre-commit stage would be installed.
#
# pre-push is deliberately NOT here (DG-479/DG-480, DG-479_DECISION.md,
# 2026-10-09): pre-commit's own pre-push stage never runs for some pushes at
# all -- a solo annotated tag pushed onto an already-public commit, or a
# push that is only ref deletions, makes pre-commit's hook_impl report
# "nothing to push" before the hook is ever invoked. The push-time scan is
# instead a *native* pre-push hook (scripts/git_hooks/pre-push, installed by
# `drunken-init --install-git-hooks` -- see src/core/git_hooks.py) that git
# always invokes directly. Declaring pre-push here too would race it: see
# DG-479_DECISION.md for why the two must never both own this stage.
default_install_hook_types: [pre-commit, commit-msg]
# Every other hook runs at the pre-commit stage only, as before; without this
# they would also be handed the commit-message file at commit-msg.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^uv\.lock$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        exclude: ^not_use/

  - repo: local
    hooks:
      # DG-259. .gitignore's `*token*` once swallowed a whole test file: the
      # commit succeeded, this hook chain passed, and the suite stayed green
      # because the file was still on disk. Nothing said the commit was
      # incomplete. Now something does.
      - id: check-ignored-sources
        name: Block commits that silently omit a gitignored source file
        entry: python scripts/check_ignored_sources.py
        language: system
        pass_filenames: false
        always_run: true

      # The operator's project ids stay out of this public repository (DG-317).
      # The test guarding it skips on CI and reads only tracked files, and a
      # real key got in twice on 2026-09-23 because of both. This checks what
      # is being committed, and the message, against this machine's registry.
      - id: check-operator-inventory
        name: Refuse staged content that names a registered project
        entry: python scripts/check_operator_inventory.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-operator-inventory-message
        name: Refuse a commit message that names a registered project
        entry: python scripts/check_operator_inventory.py --message
        language: system
        stages: [commit-msg]

      # DG-464's push-time scan moved off pre-commit's own pre-push stage
      # (DG-479/DG-480): the native hook at scripts/git_hooks/pre-push is
      # now the sole owner of it, and calls this same script's --push mode
      # itself. A pre-commit hook here too would race the native one for
      # the same stage -- see .pre-commit-config.yaml's own
      # default_install_hook_types comment and DG-479_DECISION.md.

      - id: check-settings-lint
        name: Reject bare Tool(*) wildcard allow rules in settings
        entry: python scripts/check_settings_lint.py
        language: system
        files: \.claude/settings\.json$
