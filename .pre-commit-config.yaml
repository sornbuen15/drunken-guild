# commit-msg is listed so a plain `pre-commit install` wires the message check
# too; without it only the pre-commit stage would be installed.
default_install_hook_types: [pre-commit, commit-msg]
# Every other hook runs at the pre-commit stage only, as before; without this
# they would also be handed the commit-message file at commit-msg.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^uv\.lock$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        exclude: ^not_use/

  - repo: local
    hooks:
      # DG-259. .gitignore's `*token*` once swallowed a whole test file: the
      # commit succeeded, this hook chain passed, and the suite stayed green
      # because the file was still on disk. Nothing said the commit was
      # incomplete. Now something does.
      - id: check-ignored-sources
        name: Block commits that silently omit a gitignored source file
        entry: python scripts/check_ignored_sources.py
        language: system
        pass_filenames: false
        always_run: true

      # The operator's project ids stay out of this public repository (DG-317).
      # The test guarding it skips on CI and reads only tracked files, and a
      # real key got in twice on 2026-09-23 because of both. This checks what
      # is being committed, and the message, against this machine's registry.
      - id: check-operator-inventory
        name: Refuse staged content that names a registered project
        entry: python scripts/check_operator_inventory.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-operator-inventory-message
        name: Refuse a commit message that names a registered project
        entry: python scripts/check_operator_inventory.py --message
        language: system
        stages: [commit-msg]

      - id: check-settings-lint
        name: Reject bare Tool(*) wildcard allow rules in settings
        entry: python scripts/check_settings_lint.py
        language: system
        files: \.claude/settings\.json$
