repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        exclude: ^uv\.lock$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        exclude: ^not_use/

  - repo: local
    hooks:
      - id: check-pending-approval
        name: Block commits with an unresolved Discord approval
        entry: python scripts/check_pending_approval.py
        language: system
        pass_filenames: false
        always_run: true

      # DG-259. .gitignore's `*token*` once swallowed a whole test file: the
      # commit succeeded, this hook chain passed, and the suite stayed green
      # because the file was still on disk. Nothing said the commit was
      # incomplete. Now something does.
      - id: check-ignored-sources
        name: Block commits that silently omit a gitignored source file
        entry: python scripts/check_ignored_sources.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-settings-lint
        name: Reject bare Tool(*) wildcard allow rules in settings
        entry: python scripts/check_settings_lint.py
        language: system
        files: \.claude/settings\.json$
