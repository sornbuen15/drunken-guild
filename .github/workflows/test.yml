name: CI

# Previously this ran only on main. Nearly all work lands via PRs into develop,
# so for months the workflow simply never ran for any of it — which is how CI
# stayed red from 2026-06-25 onward without anyone noticing (DG-179). Watching
# develop is the part that makes the rest of this file worth having.
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # src/service/discord_listener.py exits during import when these are unset,
  # which kills pytest collection outright. Placeholders, not secrets — nothing
  # in the suite connects to Discord.
  DISCORD_BOT_TOKEN: "ci-placeholder-token"
  DISCORD_CHANNEL_ID: "123456789"

jobs:
  # GitHub filters paths per *workflow*, not per job, so the obvious
  # `paths-ignore: ["**.md"]` would also switch off the secret scan and the
  # documentation-drift check -- the two checks that most need to run when the
  # change is markdown. This job answers the narrower question instead, and the
  # jobs that only care about Python read the answer.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.probe.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff needs both ends of the range present.
          fetch-depth: 0

      - id: probe
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Fails open, deliberately. A new branch reports an all-zero `before`
          # and a force-push can name a commit that is no longer reachable; in
          # either case the honest answer is "unknown", and a silent skip is the
          # failure mode this repo has been bitten by before. Unknown runs
          # everything.
          if [ -z "$BASE" ] \
             || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Anything that is not markdown counts as code, including this
          # workflow, pyproject.toml and the lockfile.
          #
          # Counted rather than tested with `grep -qv`. That spelling reads
          # correctly and is wrong: BSD grep returns 1 when a non-matching line
          # exists and 0 on empty input -- exactly inverted -- so the same file
          # would have been gated one way on a maintainer's Mac and the other
          # way on the GNU grep in CI. `-cv` means the same thing on both.
          # The trailing `|| true` is load-bearing: grep exits 1 when the count
          # is zero, which under `set -e` would kill the step.
          non_md=$(git diff --name-only "$BASE" "$GITHUB_SHA" | grep -cv '\.md$' || true)
          if [ "$non_md" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject and was never actually
        # exercised until now; 3.13 is what the maintainers run.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installing from pyproject rather than requirements-dev.txt is the whole
      # fix for the second failure: that file is hand-maintained, had drifted,
      # and was missing pytest-asyncio, so 38 async tests failed with "async def
      # function and no async plugin installed". One source of truth.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests

      - name: Types
        run: mypy src

      - name: Tests
        run: pytest

  # No `needs: changes` gate here on purpose. gitleaks scans markdown as
  # readily as Python, and check_doc_drift.py exists precisely for documentation
  # changes. This job runs on every push and every pull request.
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # The project itself is not installed here. bandit reads source, and
      # pip-audit reads the lockfile — installing would only add drunken-guild
      # itself, which is not on PyPI, so --strict would then fail on its own
      # unauditable package rather than on anything real.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      # Known CVEs in everything we lock. Fails the build rather than warning:
      # this is a tool other people install and point at their credentials.
      # requirements-dev.txt is generated from pyproject (scripts/lock_deps.sh),
      # so auditing it audits what actually gets installed.
      - name: Dependency audit
        run: pip-audit --strict --progress-spinner off -r requirements-dev.txt

      # Static analysis, gated at MEDIUM and above — a real bar rather than a
      # decorative one. The three MEDIUM findings this repo had (B310,
      # unrestricted urlopen schemes) were fixed by routing every outbound call
      # through core.http, not by suppressing them. The remaining LOW findings
      # are try/except/pass style in service/, tracked rather than silently
      # ignored.
      - name: Static analysis
        run: bandit -r src -ll

      # Secret scanning across the full history. Test fixtures that deliberately
      # look like credentials carry an explicit marker, allowlisted in
      # .gitleaks.toml.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      # DG-238 was a manual sweep of 34 stale references, needed because
      # --workspace stayed advertised in the README for two releases after it
      # was deleted. A sweep has a shelf life; this does not. Deliberately a
      # grep list rather than a real doc-vs-code checker — the discipline it
      # needs is small: the PR that removes something adds its name.
      - name: Documentation drift
        run: python scripts/check_doc_drift.py

  clean-install:
    name: clean install
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      # Proves what the unit tests structurally cannot: that someone who is not
      # us, with no .env and no config anywhere, can install this and reach a
      # working, safe setup. Every failure in MCP-ARCHITECTURE.md §1 was
      # invisible on an already-configured machine.
      - name: Clean-room verification
        run: ./scripts/verify_clean_install.sh
