name: Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    - name: Run pytest
      env:
        # Dummy values only -- src/service/discord_listener.py exits at
        # import time if these are unset, which otherwise kills pytest
        # collection (an unhandled SystemExit) before a single test runs.
        # Nothing in the suite actually connects to Discord.
        DISCORD_BOT_TOKEN: "ci-placeholder-token"
        DISCORD_CHANNEL_ID: "123456789"
      run: |
        pytest tests/
