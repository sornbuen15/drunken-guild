[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drunken-guild"
# Single source of truth for the version. Code reads it back via
# importlib.metadata (see core.doctor.package_version) rather than keeping a
# second copy — this field sat at 1.6.0 through the v1.7.0…v2.0.1 releases of
# the predecessor, so every installed copy reported a version four releases
# stale and nobody could tell whether they had a given fix.
#
# It then happened again: 2.1.0 stood through two more releases (DG-256). A
# comment did not stop the second occurrence, so `drunken-doctor` now checks it
# — `version.declared` fails when this is behind the newest tag. Bump it in the
# release commit, or the check will say so.
#
# The count starts at 1.0.0 and not 2.4.0: this repo is the merge of two
# products that carried two incompatible tag series reading as one line. Every
# tag was deleted on purpose and the count restarted here.
#
# 1.2.0, and the reasoning is on the record because the rule points elsewhere.
# `git-workflow` says retiring a skill or a slash command is a breaking interface
# change, which would make this 2.0.0: DG-263 withdrew four skills and three
# triggers (/debug-mantra, /post-mortem, /scrutinize). The Boss decided 1.2.0
# with that rule in view -- those four were vendored from a third party and were
# never this project's to ship, so removing them corrects a provenance claim
# rather than withdrawing an interface this project ever owned. Anyone who was
# invoking them still has them: the installed copies are symlinks into the
# upstream pack, not into this repository.
#
# The MINOR half is earned on its own -- DG-322 and DG-324 add capability
# (doctor reporting unresolvable host servers, the host-config operator
# scripts), and DG-321 and DG-325 repair rather than remove.
#
# 1.3.1, and 1.3.0 was never declared here. `v1.3.0` was tagged on PR #71, a
# plain develop-to-main sync that changed no version -- the mistake DG-330
# describes -- so this field read 1.2.0 under a 1.3.0 tag and `version.declared`
# failed on both branches. The tag stays: it names a real commit, and that
# commit did carry a MINOR change (the python-quality-gates skill, DG-333).
# 1.3.1 is that commit plus DG-334, a security repair, so PATCH (DG-335).
version = "1.3.1"
description = "Skills, agents and MCP servers for directing AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # `discord.py` and the `aiohttp` floor pinned for it left with the bot
    # (DG-355). Notifications are one POST to a webhook through `core.http`,
    # which is urllib — a gateway library for a message nobody replies to was
    # the only thing keeping a websocket client in this dependency tree.
    "python-dotenv>=0.21.0",
    # Pinned <2 deliberately: mcp 2.0.0 removed `mcp.server.fastmcp` (replaced by
    # `mcp.server.mcpserver.MCPServer`), so an unpinned resolve crashes every
    # server at import time. 1.28+ is the floor because that is where
    # `streamable_http`, `auth` and `transport_security` all land — the pieces
    # the HTTP transport mode needs. Migrating to 2.x is tracked separately.
    "mcp>=1.28.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-html>=4.0.0",
    # Pinned exactly, and it has to be. A formatter has no right answer
    # independent of its version: `ruff format --check` asks "does this match
    # what *this* ruff would write", so a range means CI resolves the newest
    # while a checkout keeps whatever it locked, and the same tree gets two
    # answers. That is not hypothetical — 0.15.22 and 0.16.4 disagree about
    # blank lines before a class, so DG-265 passed `--check` locally and turned
    # develop red, and two later PRs inherited a failure in a file neither
    # touched (DG-270).
    #
    # To bump: change this, run `ruff format src tests`, and commit the result
    # in the same commit. Never separately — a bump without the reformat is the
    # same red build one push later.
    "ruff==0.16.4",
    "pre-commit>=3.5.0",
    # mypy and pytest keep their floors deliberately. A new version of either
    # can also break CI, but it breaks it *loudly and reproducibly*: the error
    # is the same everywhere once seen. The formatter is the one that lets a
    # checkout and CI disagree in silence.
    "mypy>=1.0.0"
]
[project.scripts]
drunken-doctor = "core.doctor:main"
drunken-init = "core.init:main"
drunken-usage = "core.usage:main"
drunken-hook = "core.hook:main"
drunken-jira-mcp = "jira_mcp.server:main"


[tool.setuptools]
packages = ["scripts", "core", "route", "jira_mcp"]
package-dir = {"core" = "src/core", "route" = "src/route", "jira_mcp" = "src/jira_mcp"}

[tool.ruff.lint]
select = ["E", "F", "B", "C90", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "e2e: mark test as end-to-end"
]
# `-m "not e2e"` is what the e2e marker always meant -- its own comment says
# "so it doesn't run on standard unit test runs unless requested", but nothing
# ever deselected it, so every plain `pytest` filed two real tickets into the
# live Jira project. Run them on purpose with `pytest -m e2e`.
addopts = "--cov=src --cov-report=term-missing -v -m 'not e2e'"
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["^not_use/"]
warn_unused_ignores = false
