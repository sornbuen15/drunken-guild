[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drunken-team"
version = "1.6.0"
description = "Drunken Team Inn gateway and dashboard utilities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "discord.py>=2.0.0",
    "python-dotenv>=0.21.0",
    "mcp>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    "mypy>=1.0.0"
]
[project.scripts]
drunken-listen = "service.discord_listener:main"
drunken-register = "scripts.register_project:main"
drunken-jira-mcp = "jira_mcp.server:main"
drunken-discord-mcp = "discord_mcp.server:main"


[tool.setuptools]
packages = ["scripts", "core", "route", "service", "jira_mcp", "discord_mcp"]
package-dir = {"core" = "src/core", "route" = "src/route", "service" = "src/service", "jira_mcp" = "src/jira_mcp", "discord_mcp" = "src/discord_mcp"}

[tool.ruff.lint]
select = ["E", "F", "B", "C90", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "e2e: mark test as end-to-end"
]
addopts = "--cov=src --cov-report=term-missing -v"
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["^not_use/"]
warn_unused_ignores = false
