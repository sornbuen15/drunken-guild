[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drunken-guild"
# Single source of truth for the version. Code reads it back via
# importlib.metadata (see core.doctor.package_version) rather than keeping a
# second copy — this field sat at 1.6.0 through the v1.7.0…v2.0.1 releases of
# the predecessor, so every installed copy reported a version four releases
# stale and nobody could tell whether they had a given fix.
#
# It then happened again: 2.1.0 stood through two more releases (DG-256). A
# comment did not stop the second occurrence, so `drunken-doctor` now checks it
# — `version.declared` fails when this is behind the newest tag. Bump it in the
# release commit, or the check will say so.
#
# 1.0.0 and not 2.4.0: this repo is the merge of two products that carried two
# incompatible tag series reading as one line. Every tag was deleted on purpose
# and the count starts here. Nothing is released yet — there is no tag at all
# until `develop` reaches `main`.
version = "1.0.0"
description = "Skills, agents and MCP servers for directing AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "discord.py>=2.0.0",
    # Transitive, via discord.py, which only asks for `aiohttp<4,>=3.7.4`. Named
    # here purely to raise the floor past PYSEC-2026-3545/3546/3547, which
    # pip-audit flags in 3.14.1. Drop this line once discord.py's own floor
    # clears those.
    "aiohttp>=3.14.3",
    "python-dotenv>=0.21.0",
    # Pinned <2 deliberately: mcp 2.0.0 removed `mcp.server.fastmcp` (replaced by
    # `mcp.server.mcpserver.MCPServer`), so an unpinned resolve crashes every
    # server at import time. 1.28+ is the floor because that is where
    # `streamable_http`, `auth` and `transport_security` all land — the pieces
    # the HTTP transport mode needs. Migrating to 2.x is tracked separately.
    "mcp>=1.28.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-html>=4.0.0",
    # Pinned exactly, and it has to be. A formatter has no right answer
    # independent of its version: `ruff format --check` asks "does this match
    # what *this* ruff would write", so a range means CI resolves the newest
    # while a checkout keeps whatever it locked, and the same tree gets two
    # answers. That is not hypothetical — 0.15.22 and 0.16.4 disagree about
    # blank lines before a class, so DG-265 passed `--check` locally and turned
    # develop red, and two later PRs inherited a failure in a file neither
    # touched (DG-270).
    #
    # To bump: change this, run `ruff format src tests`, and commit the result
    # in the same commit. Never separately — a bump without the reformat is the
    # same red build one push later.
    "ruff==0.16.4",
    "pre-commit>=3.5.0",
    # mypy and pytest keep their floors deliberately. A new version of either
    # can also break CI, but it breaks it *loudly and reproducibly*: the error
    # is the same everywhere once seen. The formatter is the one that lets a
    # checkout and CI disagree in silence.
    "mypy>=1.0.0"
]
[project.scripts]
drunken-doctor = "core.doctor:main"
drunken-init = "core.init:main"
drunken-config = "core.config_gen:main"
drunken-status = "core.status:main"
drunken-away = "core.away:main"
drunken-usage = "core.usage:main"
drunken-approval-hook = "service.approval_hook:main"
drunken-listen = "service.discord_listener:main"
drunken-jira-mcp = "jira_mcp.server:main"
drunken-discord-mcp = "discord_mcp.server:main"


[tool.setuptools]
packages = ["scripts", "core", "route", "service", "jira_mcp", "discord_mcp"]
package-dir = {"core" = "src/core", "route" = "src/route", "service" = "src/service", "jira_mcp" = "src/jira_mcp", "discord_mcp" = "src/discord_mcp"}

[tool.ruff.lint]
select = ["E", "F", "B", "C90", "I"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "e2e: mark test as end-to-end"
]
# `-m "not e2e"` is what the e2e marker always meant -- its own comment says
# "so it doesn't run on standard unit test runs unless requested", but nothing
# ever deselected it, so every plain `pytest` filed two real tickets into the
# live Jira project. Run them on purpose with `pytest -m e2e`.
addopts = "--cov=src --cov-report=term-missing -v -m 'not e2e'"
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["^not_use/"]
warn_unused_ignores = false
